name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run ./ version

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build every release target
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./ && echo "built $target"
          done
      - run: bash -n install.sh

  # Installs and removes the real background service on each platform's CI runner.
  service-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Linux systemd unit
        if: runner.os == 'Linux'
        run: |
          go build -o /tmp/rytrix-ddns ./
          # The test update fails for a made-up host, but setup saves the config first.
          sudo /tmp/rytrix-ddns setup --config /etc/rytrix-ddns.json --hostname ci-smoke-test --token fake || true
          sudo /tmp/rytrix-ddns install --config /etc/rytrix-ddns.json
          sleep 5
          systemctl is-active rytrix-ddns
          sudo journalctl -u rytrix-ddns --no-pager | tail -5
          sudo /tmp/rytrix-ddns uninstall
          ! systemctl is-active rytrix-ddns

      - name: Windows service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP\rytrix-ddns.exe" ./
          $exe = "$env:RUNNER_TEMP\rytrix-ddns.exe"
          $cfg = "$env:RUNNER_TEMP\rytrix-ddns.json"
          & $exe setup --config $cfg --hostname ci-smoke-test --token fake
          & $exe install --config $cfg
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          Start-Sleep -Seconds 5
          $svc = Get-Service rytrix-ddns
          if ($svc.Status -ne 'Running') { throw "service is $($svc.Status)" }
          Get-Content "$env:RUNNER_TEMP\rytrix-ddns.log" -Tail 5
          & $exe uninstall
          if (Get-Service rytrix-ddns -ErrorAction SilentlyContinue) { throw "service still present" }
