name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs the published install scripts against the release that was just made.
  verify-install:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          sh install.sh
          rytrix-ddns version | grep -F "${GITHUB_REF_NAME#v}"
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          $out = & "$env:LOCALAPPDATA\Programs\rytrix-ddns\rytrix-ddns.exe" version
          if ($out -notmatch [regex]::Escape($env:GITHUB_REF_NAME.TrimStart('v'))) { throw "installed $out" }
